# JARVIS de Bancada — Fly.io (alternativa ao Render Free que dorme)
# Docs: deploy/FLY.md

app = "jarvis-bancada"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  LLM_PROVIDER = "openai"
  OPENAI_MODEL = "gpt-5.5"
  WHISPER_MODEL = "whisper-1"
  TTS_MODEL = "gpt-4o-mini-tts"
  TTS_VOICE = "nova"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
