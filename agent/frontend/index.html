<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: transparent; color: #e2e8f0; }
      .wrap { display:flex; flex-direction:column; gap:8px; padding:10px 12px; border-radius:12px;
        background:linear-gradient(135deg,#0f172a,#1e293b); border:1px solid #334155; }
      .row { display:flex; align-items:center; gap:10px; }
      .dot { width:12px; height:12px; border-radius:50%; background:#94a3b8; flex-shrink:0; }
      .dot.live { background:#22c55e; animation: pulse 1.4s infinite; }
      .dot.wait { background:#f59e0b; }
      .dot.speak { background:#38bdf8; animation: pulse 1.1s infinite; }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); }
        70% { box-shadow: 0 0 0 12px rgba(34,197,94,0); }
        100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
      }
      .title { font-weight:650; font-size:14px; }
      .sub { font-size:12px; color:#94a3b8; }
      .partial { min-height:1.3em; font-size:13px; color:#cbd5e1; font-style:italic; }
      .status-pill { font-size:11px; padding:3px 8px; border-radius:999px; background:#334155; white-space:nowrap; }
      button { border:0; border-radius:8px; padding:6px 10px; background:#334155; color:#fff; cursor:pointer; font-size:12px; }
      button:hover { background:#475569; }
      .err { color:#fca5a5; font-size:12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="row">
        <div id="dot" class="dot"></div>
        <div style="flex:1">
          <div class="title" id="title">Preparando microfone…</div>
          <div class="sub" id="sub">Fale com naturalidade. Eu espero você terminar a frase.</div>
        </div>
        <span class="status-pill" id="pill">—</span>
        <button id="btn" type="button">Pausar</button>
      </div>
      <div class="partial" id="partial"></div>
      <div class="err" id="err"></div>
    </div>
    <script>
      const Streamlit = {
        setComponentValue(value) {
          window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue", value }, "*");
        },
        setFrameHeight(height) {
          window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height }, "*");
        },
        events: {
          addEventListener(type, callback) {
            window.addEventListener("message", (event) => {
              if (event.data && event.data.type === type) callback(event);
            });
          },
        },
      };

      const dot = document.getElementById("dot");
      const title = document.getElementById("title");
      const sub = document.getElementById("sub");
      const partial = document.getElementById("partial");
      const err = document.getElementById("err");
      const btn = document.getElementById("btn");
      const pill = document.getElementById("pill");

      let recognition = null;
      let paused = false;
      let active = true;
      let agentSpeaking = false;
      let lastSent = "";
      let restartTimer = null;
      const speakingPauseMs = 1400;

      function setUI(state, msg) {
        err.textContent = "";
        if (state === "live") {
          dot.className = "dot live";
          title.textContent = "Ouvindo…";
          sub.textContent = msg || "Pode falar. Quando pausar, eu processo a frase.";
          pill.textContent = "OUVINDO";
          btn.textContent = "Pausar";
        } else if (state === "wait") {
          dot.className = "dot wait";
          title.textContent = "Processando fala…";
          sub.textContent = msg || "Aguarde a resposta do agente.";
          pill.textContent = "PROCESSANDO";
          btn.textContent = "Pausar";
        } else if (state === "speak") {
          dot.className = "dot speak";
          title.textContent = "Agente falando…";
          sub.textContent = msg || "Microfone pausado enquanto o JARVIS fala.";
          pill.textContent = "FALANDO";
          btn.textContent = "Pausar";
        } else if (state === "paused") {
          dot.className = "dot";
          title.textContent = "Microfone pausado";
          sub.textContent = msg || "Clique em Retomar para continuar.";
          pill.textContent = "PAUSADO";
          btn.textContent = "Retomar";
        } else {
          dot.className = "dot";
          title.textContent = "Microfone indisponível";
          sub.textContent = msg || "Use Chrome/Edge e permita o microfone.";
          pill.textContent = "ERRO";
        }
        Streamlit.setFrameHeight(document.body.scrollHeight);
      }

      function sendFinal(text) {
        const clean = (text || "").trim();
        if (!clean || clean === lastSent) return;
        lastSent = clean;
        // Para o microfone imediatamente — evita remount/removeChild no Streamlit
        // enquanto o backend fica em “JARVIS sincronizando…”.
        agentSpeaking = true;
        if (recognition) {
          try { recognition.onend = null; recognition.stop(); } catch (e) {}
          recognition = null;
        }
        if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
        setUI("wait", "Ouvi sua frase. Enviando ao agente…");
        Streamlit.setComponentValue({ transcript: clean, ts: Date.now(), status: "processing" });
      }

      function startRecognition() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          setUI("err", "Este navegador não tem reconhecimento contínuo. Use Chrome ou Edge.");
          return;
        }
        if (recognition) {
          try { recognition.onend = null; recognition.stop(); } catch (e) {}
          recognition = null;
        }
        recognition = new SR();
        recognition.lang = "pt-BR";
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        let buffer = "";
        let silenceTimer = null;

        recognition.onstart = () => {
          if (!paused && active && !agentSpeaking) setUI("live");
        };
        recognition.onerror = (event) => {
          if (event.error === "not-allowed") {
            setUI("err", "Permissão de microfone negada. Autorize e recarregue.");
            return;
          }
          if (event.error === "no-speech" || event.error === "aborted") return;
          err.textContent = "Aviso: " + event.error;
        };
        recognition.onresult = (event) => {
          if (agentSpeaking || paused) return;
          let interim = "";
          let finalChunk = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const res = event.results[i];
            if (res.isFinal) finalChunk += res[0].transcript;
            else interim += res[0].transcript;
          }
          if (interim) partial.textContent = "… " + interim;
          if (finalChunk) {
            buffer = (buffer + " " + finalChunk).replace(/\s+/g, " ").trim();
            partial.textContent = buffer;
            if (silenceTimer) clearTimeout(silenceTimer);
            silenceTimer = setTimeout(() => {
              if (buffer) {
                sendFinal(buffer);
                buffer = "";
                partial.textContent = "";
              }
            }, speakingPauseMs);
          }
          Streamlit.setFrameHeight(document.body.scrollHeight);
        };
        recognition.onend = () => {
          if (!paused && active && !agentSpeaking) {
            restartTimer = setTimeout(() => {
              try { recognition.start(); } catch (e) {}
            }, 250);
          }
        };
        try {
          recognition.start();
          setUI(agentSpeaking ? "speak" : "live");
        } catch (e) {
          setUI("err", "Não consegui iniciar o microfone.");
        }
      }

      btn.onclick = () => {
        paused = !paused;
        if (paused) {
          if (recognition) {
            try { recognition.onend = null; recognition.stop(); } catch (e) {}
          }
          setUI("paused");
        } else {
          lastSent = "";
          startRecognition();
        }
      };

      function onRender(event) {
        const data = (event.data && event.data.args) || {};
        active = data.active !== false;
        agentSpeaking = data.paused === true || data.agent_speaking === true;
        if (!active) {
          paused = true;
          setUI("paused", "Escuta desligada.");
          return;
        }
        if (agentSpeaking) {
          if (recognition) {
            try { recognition.onend = null; recognition.stop(); } catch (e) {}
          }
          setUI("speak");
          return;
        }
        if (!recognition || paused) {
          paused = false;
          startRecognition();
        } else {
          setUI("live");
        }
      }

      Streamlit.events.addEventListener("streamlit:render", onRender);
      window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
      Streamlit.setFrameHeight(120);
      startRecognition();
    </script>
  </body>
</html>
