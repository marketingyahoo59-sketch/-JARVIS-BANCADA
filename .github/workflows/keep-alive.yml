name: Keep JARVIS Awake

on:
  schedule:
    # a cada 5 minutos
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          set -e
          URL="https://jarvis-bancada.onrender.com/"
          for i in 1 2 3; do
            code=$(curl -sS -m 45 -o /tmp/out.html -w "%{http_code}" "$URL" || echo 000)
            echo "try=$i code=$code"
            if [ "$code" = "200" ]; then
              echo "JARVIS acordado"
              exit 0
            fi
            sleep 8
          done
          echo "Falha ao acordar JARVIS" >&2
          exit 1
