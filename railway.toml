# Railway — JARVIS de Bancada
# Deploy: Dockerfile | Volume em /data (memória SQLite + fotos)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Variáveis (defina no painel Railway):
# OPENAI_API_KEY=...
# JARVIS_DATA_DIR=/data
# JARVIS_TTS=edge
# LLM_PROVIDER=openai
# OPENAI_MODEL=gpt-4o-mini   # mais barato/rápido na bancada; use gpt-4o para visão
